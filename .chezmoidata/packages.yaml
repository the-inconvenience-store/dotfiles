packages:
  server:
    darwin:
      brews:
        - git
        - zsh
        - direnv
        - yazi
        - bat
        - eza
        - ripgrep
        - fd
        - fzf
        - zoxide
        - jq
        - neovim
        - tmux
        - btop
        - tailscale
    linux:
      # Neovim and Yazi use verified upstream binaries; Tailscale uses its
      # official repository installer. No fonts or media preview stack.
      apt:
        - ca-certificates
        - curl
        - git
        - rsync
        - file
        - unzip
        - build-essential
        - zsh
        - direnv
        - bat
        - eza
        - ripgrep
        - fd-find
        - fzf
        - zoxide
        - jq
        - tmux
        - btop
  darwin:
    brews:
      - coreutils
      - git
      - zoxide
      - neofetch
      - bat
      - eza
      - dua-cli
      # Yazi and its optional preview/search dependencies (file is provided by macOS).
      - yazi
      - ffmpeg-full
      - sevenzip
      - poppler
      - fd
      - resvg
      - imagemagick-full
      - ripgrep
      - direnv
      - make
      - fzf
      - jq
      - mongosh
      - node
      - rustup
      - python
      - uv
      - pyenv
      - neovim
      - tmux
      - herdr
      - mole
      - tailscale
      - btop
      - mise
      - tree-sitter-cli
      - lspmux
    casks:
      - iterm2
      - orbstack
      - vorssaint
      - font-symbols-only-nerd-font
  linux:
    apt:
      - build-essential
      - curl
      - rsync
      - file
      - git
      - ufw
      - gpg
      - zsh
      - direnv
      - neovim
      - fonts-powerline
      - bat
      - ripgrep
      - fzf
      - jq
      - eza
      - dua-cli
      - zoxide
      - tmux
      - tailscale
      - btop
      - tree-sitter-cli
      - fontconfig
