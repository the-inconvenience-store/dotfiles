unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on
set -g base-index 1

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# gruvbox
set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark256'
set -g @tmux-gruvbox-statusbar-alpha 'true'


# catppuccin
#set -g @catppuccin_flavor "mocha"
#set -g @catppuccin_window_status_style "rounded"

#set -g status-right-length 100
#set -g status-left-length 100
#set -g status-left ""
#set -g status-right "#{E:@catppuccin_status_application}"
#set -ag status-right "#{E:@catppuccin_status_session}"
#set -ag status-right "#{E:@catppuccin_status_uptime}"

# POPUP SHELL
bind -n S-F7 display-popup -T ' +#S ' -h 60% -E ~/.tmux/scripts/show-tmux-popup.sh

set -g popup-border-style fg=colour245
set -g popup-border-lines rounded

# support detaching from nested session with the same shortcut
bind -T popup S-F7 detach

# bind -T popup C-o copy-mode
# bind -T popup M-c new-window -c '#{pane_current_path}'
# bind -T popup M-n next-window
# bind -T popup M-m previous-window

bind -T popup C-S-F7 run 'tmux move-window -a -t $TMUX_PARENT_SESSION:{next}'

